<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حضور وغياب الطالبات</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#1f3864"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--brd:#dfe3ec;--pri:#1f3864;--ok:#1e8e4e;--okb:#dff5e8;--bad:#c62828;--badb:#fde3e3;--hl:#e8eefb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111622;--card:#1a2133;--tx:#eef1f8;--mut:#9aa4bb;--brd:#2c3550;--pri:#7ea2ee;--ok:#5fd28c;--okb:#173a28;--bad:#ff8a8a;--badb:#4a1f24;--hl:#222c47}}
:root[data-theme="dark"]{--bg:#111622;--card:#1a2133;--tx:#eef1f8;--mut:#9aa4bb;--brd:#2c3550;--pri:#7ea2ee;--ok:#5fd28c;--okb:#173a28;--bad:#ff8a8a;--badb:#4a1f24;--hl:#222c47}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif}
body{max-width:640px;margin:0 auto;padding-bottom:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 6px}
h1{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.sync{font-size:11px;font-weight:400;color:var(--mut)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1}
button{font:inherit;border:1px solid var(--brd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 12px;min-height:44px}
button.on{background:var(--pri);color:var(--bg);border-color:var(--pri);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px}
.chips button{flex:0 0 auto;padding:8px 12px;min-height:40px;font-size:14px}
.lab{font-size:12px;color:var(--mut);padding:8px 14px 0}
.bar{display:flex;gap:6px;padding:8px 12px;font-size:13px}
.bar div{flex:1;text-align:center;border-radius:10px;padding:6px 2px;background:var(--card);border:1px solid var(--brd)}
.bar b{display:block;font-size:18px}
.acts{display:flex;gap:6px;padding:0 12px 8px}
.acts button{flex:1;font-size:13px;min-height:40px}
.row{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:8px 10px;background:var(--card);border:1px solid var(--brd);border-radius:12px;min-height:52px}
.row .n{width:22px;color:var(--mut);font-size:12px;text-align:center}
.row .nm{flex:1;font-size:15px;line-height:1.35}
.row .nt{display:block;font-size:11px;color:var(--bad)}
.pill{min-width:64px;text-align:center;border-radius:20px;padding:8px 6px;font-size:13px;font-weight:700;background:var(--hl);color:var(--mut)}
.row.h{border-color:var(--ok);background:var(--okb)}.row.h .pill{background:var(--ok);color:#fff}
.row.g{border-color:var(--bad);background:var(--badb)}.row.g .pill{background:var(--bad);color:#fff}
.card{margin:8px 12px;background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:10px;overflow-x:auto}
h2{font-size:14px;margin:0 0 8px;color:var(--pri)}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
th,td{border-bottom:1px solid var(--brd);padding:7px 4px;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
tr.lv td{background:var(--hl);font-weight:700}tr.tt td{background:var(--pri);color:var(--bg);font-weight:700}
td.bad{color:var(--bad);font-weight:700}.mut{color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--tx);min-height:44px}
select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--tx);min-height:44px}

:root{--web:#fff1dc;--lvb:#e1efff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--web:#4a3512;--lvb:#14304f}}
:root[data-theme="dark"]{--web:#4a3512;--lvb:#14304f}
.row.e{border-color:#b26a00;background:var(--web)}.row.e .pill{background:#b26a00;color:#fff}
.row.l{border-color:#1565c0;background:var(--lvb)}.row.l .pill{background:#1565c0;color:#fff}
.pill{white-space:nowrap}
.dots{min-width:44px;padding:6px;font-weight:700;font-size:18px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet button{width:100%;margin-top:6px;text-align:right}
.sm{font-size:12px;min-height:36px;padding:6px 10px}
.lg{padding:0 14px 6px;font-size:12px;color:var(--mut)}
.row.r2{flex-wrap:wrap;gap:6px}.row.r2 .r1{display:flex;align-items:center;gap:8px;width:100%}
.row.r3{flex-wrap:wrap;gap:4px;padding:5px 6px;min-height:46px}.row.r3 .nm{font-size:13.5px;min-width:80px;line-height:1.3}.row.r3 .note{flex-basis:100%}
.nb{border:0;background:transparent;font-size:14px;padding:0 4px;opacity:.45}.nb.has{opacity:1}
.btns3{display:flex;gap:3px;direction:rtl}.btns3 .b{min-width:36px;min-height:36px;padding:2px 3px;font-size:11px;font-weight:700;border-radius:9px;border:1px solid var(--brd);background:var(--card);color:var(--mut)}
.btns3 .b.on{color:#fff}.btns3 .b.on.h{background:var(--ok);border-color:var(--ok)}.btns3 .b.on.g{background:var(--bad);border-color:var(--bad)}.btns3 .b.on.e{background:#b26a00;border-color:#b26a00}.btns3 .b.on.l{background:#1565c0;border-color:#1565c0}
.btns3 select.xs{width:84px;font-family:inherit;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;padding:0 2px;font-size:10px}
.row.r3.dflt .btns3 .b.on{opacity:.55}
select.ex{width:100%;min-height:42px;font:inherit;border-radius:10px;border:1px solid #1565c0;padding:0 8px;background:var(--card);color:var(--fg,inherit)}
input.note{width:100%;min-height:38px;font:inherit;font-size:13px;border-radius:10px;border:1px dashed var(--brd);padding:0 10px;background:transparent;color:inherit}
</style></head><body>
<header><h1><span>📋 حضور وغياب الطالبات</span><span class="sync" id="sync"></span></h1>
<div class="tabs"><button id="t1" onclick="setTab('att')">تسجيل الحضور</button><button id="t2" onclick="setTab('rep')">التقرير اليومي</button><button id="t4" onclick="setTab('stu')" style="flex:0 0 auto">👩‍🎓 الطالبات</button><button id="t3" onclick="setTab('set')" style="flex:0 0 52px">⚙</button></div></header>
<main id="app"></main>
<script>
(function(){
  var URL_='https://script.google.com/macros/s/AKfycbw5KjXntvX_oraaN0MSvdHD_6u9J6yC3OUUzI6A1n5ZKW5tFXDXjFVEsGAU-k2hsKNp/exec';
  var q=new URLSearchParams(location.search),K=q.get('k');
  try{if(K)localStorage.setItem('att_k',K);else K=localStorage.getItem('att_k')}catch(e){}
  var app=document.getElementById('app');
  function msg(h){app.innerHTML='<div class="card" style="margin:16px 12px;line-height:1.9">'+h+'</div>'}
  if(!K){msg('افتحي <b>الرابط الخاص بصفّكِ</b> الذي أرسلته المديرة (مرة واحدة مع الإنترنت).');return}
  try{var mf={name:'حضور وغياب الطالبات',short_name:'الحضور',start_url:'./?k='+encodeURIComponent(K),scope:'./',display:'standalone',background_color:'#f4f6fb',theme_color:'#1f3864',lang:'ar',dir:'rtl',icons:[{src:new URL('icon-192.png',location.href).href,sizes:'192x192',type:'image/png'},{src:new URL('icon-512.png',location.href).href,sizes:'512x512',type:'image/png'}]};
    var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
  var boot=null;try{boot=JSON.parse(localStorage.getItem('att_boot_'+K))}catch(e){}
  function fetchBoot(){return fetch(URL_+'?a=boot&k='+encodeURIComponent(K)).then(function(r){return r.json()}).then(function(j){if(j&&j.ok&&j.d){try{localStorage.setItem('att_boot_'+K,JSON.stringify(j.d))}catch(e){}return j.d}throw new Error('bad')})}
  function run(code,src){var s=document.createElement('script');if(code){s.text=code}else{s.src=src}document.body.appendChild(s)}
  function go(b){window.__BOOT=b;window.__K=K;var c=null;try{c=localStorage.getItem('att_appjs')}catch(e){}
    if(c){run(c)}else{run(null,'app.js?v=14')}
    if(navigator.onLine){fetch(URL_+'?a=appjs').then(function(r){return r.text()}).then(function(t){if(t&&t.length>5000&&t.indexOf('window.__BOOT')>0){try{localStorage.setItem('att_appjs',t)}catch(e){}}}).catch(function(){})}}
  if(boot){go(boot);if(navigator.onLine)fetchBoot().catch(function(){})}
  else if(!navigator.onLine){msg('هذه أول مرة تفتحين فيها الرابط، ويلزم <b>إنترنت لمرة واحدة فقط</b> لتحميل قائمة الطالبات، وبعدها تعملين بدون إنترنت.')}
  else{msg('جارٍ التحميل...');fetchBoot().then(go).catch(function(){msg('تعذّر التحميل. تأكدي من الإنترنت وأعيدي المحاولة، أو من صحة الرابط.')})}
})();
</script></body></html>
