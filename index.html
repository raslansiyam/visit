<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم المعلم</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d5a8c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky tab bar; visit form as stacked domain sections with 1–5 tap scales; records and teacher summary as lists */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --ink:#22262f; --muted:#646a76; --line:#dedfd8;
  --accent:#2d5a8c; --accent-ink:#ffffff; --accent-soft:#e4ecf5;
  --s1:#b5412f; --s2:#cf7a2b; --s3:#b99a1d; --s4:#5f9a3a; --s5:#2f7d4f;
  --good:#2f7d4f; --bad:#b5412f;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14161b; --surface:#1c1f26; --ink:#e6e8ec; --muted:#9aa0ab; --line:#2d313a;
  --accent:#7fa9dc; --accent-ink:#10141a; --accent-soft:#1f2b3b;
  --s1:#ec7f6c; --s2:#eda15a; --s3:#d9c053; --s4:#8cc767; --s5:#5fc28a; --good:#5fc28a; --bad:#ec7f6c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-left:16px;padding-right:16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 10px;display:flex;flex-direction:column;gap:2px}
.org{font-size:12px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:21px;margin:2px 0 0}
.school{font-size:13.5px;color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:8px;display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab{flex:1;font-family:var(--display);font-weight:600;font-size:14px;padding:8px 6px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main .wrap{padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
h2{font-family:var(--display);font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 .avg{font-size:13px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column;margin-top:8px}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:none}
.item .t{flex:1 1 220px;min-width:0;font-size:14.5px;display:flex;gap:8px}
.item .t .n{color:var(--muted);font-family:var(--display);font-variant-numeric:tabular-nums;min-width:18px}
.item .t input{padding:6px 8px;font-size:14px}
.scale{display:flex;gap:6px}
.scale button{width:40px;height:40px;padding:0;border-radius:50%;font-family:var(--display);font-weight:600;font-size:15px}
.scale button[aria-pressed="true"]{color:#fff;border-color:transparent}
.scale button[data-v="1"][aria-pressed="true"]{background:var(--s1)}
.scale button[data-v="2"][aria-pressed="true"]{background:var(--s2)}
.scale button[data-v="3"][aria-pressed="true"]{background:var(--s3)}
.scale button[data-v="4"][aria-pressed="true"]{background:var(--s4)}
.scale button[data-v="5"][aria-pressed="true"]{background:var(--s5)}
.legend{font-size:12px;color:var(--muted)}
.notes{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.notes .nbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
textarea[data-note]{min-height:110px}
.mseg{display:flex}
.mseg button{border-radius:0;font-size:12.5px;padding:5px 10px;white-space:nowrap}
.mseg button:first-child{border-start-start-radius:9px;border-end-start-radius:9px}
.mseg button:last-child{border-start-end-radius:9px;border-end-end-radius:9px;border-inline-start:none}
.mseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea[readonly]{background:var(--accent-soft);border-color:transparent}
.notes .nbar .old{font-size:12.5px;padding:4px 10px;color:var(--accent);border-color:var(--accent)}
.savebar{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
.savebar .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.score{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:14px}
.score b{font-size:20px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-weight:600;padding:10px 18px}
.ghost{color:var(--accent);border-color:var(--accent)}
.danger{color:var(--bad);border-color:var(--bad)}
.danger.armed{background:var(--bad);color:#fff}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--s2)} .dot.err{background:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.vrow .who{min-width:0;flex:1}
.vrow .name{font-weight:600}
.vrow .sub{font-size:12.5px;color:var(--muted)}
.pct{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button,.acts a{font-size:13px;padding:6px 10px}
.acts a{border:1px solid var(--line);border-radius:10px;color:var(--accent);text-decoration:none}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--muted);background:var(--bg)}
td:first-child,th:first-child{text-align:start}
.pinbox{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:30px auto}
.pinbox input{font-size:20px;text-align:center;letter-spacing:4px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;inset-inline:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13.5px}
#printArea{display:none}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.scale button{width:38px;height:38px}}
@media print{
  body{background:#fff;color:#000}
  #app{display:none!important}
  #printArea{display:block!important}
}
</style></head><body>
<div id="app" dir="rtl" lang="ar">
<header class="top"><div class="wrap">
  <div class="org">وكالة الغوث الدولية – برنامج التربية والتعليم · منطقة غرب الوسطى التعليمية</div>
  <h1>تقييم المعلم – زيارة صفية</h1>
  <div class="school" style="display:flex;justify-content:space-between;gap:8px;align-items:center">مدرسة النصيرات المشتركة الإعدادية<button id="btnSet" style="font-size:12px;padding:4px 10px">⚙ الإعدادات</button></div>
</div></header>
<div class="bar" id="bar" hidden><div class="wrap">
  <button class="tab" data-v="new" aria-pressed="true">زيارة جديدة</button>
  <button class="tab" data-v="list" aria-pressed="false">سجل الزيارات</button>
  <button class="tab" data-v="teachers" aria-pressed="false">ملخص المعلمين</button>
</div></div>
<main><div class="wrap" id="main"><div class="empty">جارٍ التحميل …</div></div></main>
<div class="savebar" id="savebar" hidden><div class="wrap">
  <div class="score" id="score"></div>
  <div style="display:flex;gap:8px"><button class="ghost" id="btnClear">نموذج جديد</button><button class="primary" id="btnSave">حفظ الزيارة</button></div>
</div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span></div>
</div>
<div id="printArea"></div>

<script>
const DOMAINS = [
  {key:'plan', title:'التخطيط', items:[
    'الالتزام باستخدام روتينات التعلم',
    'ربط الدرس بالتعلم السابق والمهارات الحياتية',
    'الأهداف واضحة ومحددة ومناسبة لمستوى الطلبة',
    'استراتيجيات التدريس والأنشطة متنوعة وتحقق الأهداف',
    'الوسائل والمصادر التعليمية مناسبة وتحقق الهدف',
    'أساليب التقويم متنوعة (قبلي، تكويني، ختامي)']},
  {key:'mgmt', title:'الإدارة الصفية', items:[
    'تنظيم البيئة المادية للصف',
    'إتقان مهارات الاتصال والتواصل مع الطلبة',
    'التعامل مع سلوكات الطلبة',
    'توزيع وقت الحصة على الفعاليات المختلفة بشكل مناسب',
    'ضبط الصف وتنظيم حركة الطلبة']},
  {key:'exec', title:'تنفيذ التعليم والتعلم', items:[
    'التهيئة للدرس وتوظيف خبرات الطلبة السابقة',
    'التنويع في استراتيجيات التدريس والتعلم النشط',
    'وضوح خطوات الدرس وتسلسلها',
    'إثارة دافعية الطلبة وتعزيز استجاباتهم',
    'تنمية مهارات التفكير العليا لدى الطلبة',
    'مراعاة الفروق الفردية بين الطلبة',
    'ربط محتوى الدرس بخبرات الطلبة',
    'توظيف الألعاب التربوية الهادفة',
    'تعزيز القيم والاتجاهات',
    'تشجيع الطلبة على البحث والاستقصاء وجمع الشواهد',
    'مراعاة التعليم الجامع واستراتيجياته']},
  {key:'eval', title:'التقويم', items:[
    'تشجيع الطلبة على طرح الأسئلة',
    'تزويد الطلبة بتغذية راجعة',
    'متابعة كراسات الطلبة وتدقيقها',
    'تشجيع الطلبة على التقويم الذاتي',
    'رصد نتائج التقويم']},
  {key:'out', title:'نتائج التعلم', items:[
    'مستوى أعمال الطلاب الكتابية',
    'قدرة التلاميذ التعبيرية',
    'اكتساب الطلاب البنية المعرفية للموضوع']}
];
const SUBJECTS = ['لغة عربية','رياضيات','علوم','لغة إنجليزية'];
const GRADES = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع'];
const HEADER = ['وكالة الغوث الدولية – برنامج التربية والتعليم','منطقة غرب الوسطى التعليمية','مدرسة النصيرات المشتركة الإعدادية'];

let PIN='', INIT={teachers:[],visits:[],principal:''};
let view='new', state='connecting';
let pending=[];              // visits waiting to be sent
let form=blank();
const $main=document.getElementById('main');

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;} }
PIN = ls('pin')||'';
const IS_GAS = !!(window.google && google.script && google.script.run);
let API = ls('api')||'';
let MINE = {}; try{ MINE=JSON.parse(ls('mine')||'{}')||{}; }catch(e){}
function keepMine(v){ const c=JSON.parse(JSON.stringify(v)); delete c.report; MINE[v.id]=c; ls('mine',JSON.stringify(MINE)); }
try{ pending = JSON.parse(ls('pending')||'[]')||[]; }catch(e){ pending=[]; }
try{ const d=JSON.parse(ls('draft')||'null'); if(d && d.scores) form=d; }catch(e){}
function saveLocal(){ ls('pending',JSON.stringify(pending)); ls('draft',JSON.stringify(form)); }

function call(fn,...a){
  if(IS_GAS) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
  if(!API) return Promise.reject(new Error('no api'));
  if(!navigator.onLine) return Promise.reject(new Error('offline'));
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),45000);
  return fetch(API,{method:'POST',body:JSON.stringify({fn,args:a}),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:ctl.signal})
    .then(r=>r.json()).then(j=>{ clearTimeout(t); if(!j||!j.ok) throw new Error(j&&j.error||'server'); return j.data; })
    .catch(e=>{ clearTimeout(t); throw e; });
}
if(!IS_GAS && 'serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
let toastT; function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function blank(){ return {id:'',date:today(),teacher:'',cls:'',count:'',absent:'',subject:'',title:'',scores:{},evalItems:['','','','',''],notes:{},positives:'',reflections:''}; }
function newId(){ return 'V'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- ready phrases ---------- */
const PH = {
  plan:{lead:'تميّز التخطيط', need:'ويحتاج التخطيط إلى', ok:'تخطيط جيد بشكل عام', p:[
    'الالتزام باستخدام روتينات التعلم',
    'ربط الدرس بالتعلم السابق والمهارات الحياتية',
    'وضوح الأهداف ودقتها وملاءمتها لمستوى الطلبة',
    'تنوّع الاستراتيجيات والأنشطة المحققة للأهداف',
    'ملاءمة الوسائل والمصادر التعليمية للهدف',
    'تنوّع أساليب التقويم (القبلي والتكويني والختامي)']},
  mgmt:{lead:'تميّزت الإدارة الصفية', need:'وتحتاج الإدارة الصفية إلى', ok:'إدارة صفية جيدة بشكل عام', p:[
    'تنظيم البيئة المادية للصف',
    'إتقان مهارات الاتصال والتواصل مع الطلبة',
    'حسن التعامل مع سلوكات الطلبة',
    'التوزيع المناسب لوقت الحصة على الفعاليات',
    'ضبط الصف وتنظيم حركة الطلبة']},
  exec:{lead:'تميّز تنفيذ التعليم والتعلم', need:'ويحتاج التنفيذ إلى', ok:'تنفيذ جيد للدرس بشكل عام', p:[
    'التهيئة الجيدة للدرس وتوظيف خبرات الطلبة السابقة',
    'التنويع في استراتيجيات التدريس والتعلم النشط',
    'وضوح خطوات الدرس وتسلسلها',
    'إثارة دافعية الطلبة وتعزيز استجاباتهم',
    'تنمية مهارات التفكير العليا',
    'مراعاة الفروق الفردية بين الطلبة',
    'ربط محتوى الدرس بخبرات الطلبة',
    'توظيف الألعاب التربوية الهادفة',
    'تعزيز القيم والاتجاهات',
    'تشجيع الطلبة على البحث والاستقصاء وجمع الشواهد',
    'مراعاة التعليم الجامع واستراتيجياته']},
  eval:{lead:'تميّز التقويم', need:'ويحتاج التقويم إلى', ok:'تقويم جيد بشكل عام', p:[
    'تشجيع الطلبة على طرح الأسئلة',
    'تزويد الطلبة بتغذية راجعة مستمرة',
    'متابعة كراسات الطلبة وتدقيقها',
    'تشجيع الطلبة على التقويم الذاتي',
    'الرصد المنتظم لنتائج التقويم']},
  out:{lead:'تميّزت نتائج التعلم', need:'وتحتاج نتائج التعلم إلى', ok:'نتائج تعلم جيدة بشكل عام', p:[
    'جودة أعمال الطلبة الكتابية',
    'قدرة الطلبة التعبيرية',
    'اكتساب الطلبة البنية المعرفية للموضوع']}
};
function joinAr(list){ return list.map((x,i)=>i?'و'+x:x).join('، '); }
function genNote(key){
  const ph=PH[key], d=DOMAINS.find(x=>x.key===key); if(!ph||!d) return '';
  const top=[], low=[], weak=[]; let rated=0;
  d.items.forEach((_,i)=>{ const v=form.scores[key+(i+1)]; if(!v) return; rated++;
    if(v===5) top.push(ph.p[i]); else if(v<=2) weak.push(ph.p[i]); else if(v===3) low.push(ph.p[i]); });
  if(!rated) return '';
  const need=[...weak,...low];
  let a='';
  if(top.length) a=`${ph.lead} ب${joinAr(top)}`;
  else a=ph.ok;
  if(!need.length) return a+'.';
  let b='';
  if(weak.length && low.length) b=`، مع ضرورة الاهتمام ب${joinAr(weak)}، والعمل على تعزيز ${joinAr(low)}`;
  else if(weak.length) b=`، مع ضرورة الاهتمام ب${joinAr(weak)}`;
  else b=`، مع النظر لتعزيز ${joinAr(low)}`;
  if(!top.length){
    if(weak.length && low.length) return `${ph.need} الاهتمام ب${joinAr(weak)}، والعمل على تعزيز ${joinAr(low)}.`.replace(/^و/,'');
    if(weak.length) return `${ph.need} الاهتمام ب${joinAr(weak)}.`.replace(/^و/,'');
    return `${ph.ok}، مع النظر لتعزيز ${joinAr(low)}.`;
  }
  return a+b+'.';
}
function showNote(k){
  const mode=(form.noteMode||{})[k]||'auto';
  const el=document.querySelector(`[data-note="${k}"]`);
  document.querySelectorAll(`[data-mode][data-k="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  if(mode==='auto'){
    const t=genNote(k); form.notes[k]=t;
    if(el){ el.readOnly=true; el.value=t; el.placeholder='تظهر هنا العبارة الجاهزة عند تقييم بنود هذا المجال'; }
  }else{
    form.notes[k]=(form.own||{})[k]||'';
    if(el){ el.readOnly=false; el.value=form.notes[k]; el.placeholder='اكتب ملاحظاتك على هذا المجال'; }
  }
}

/* ---------- scoring ---------- */
function calc(f){
  const dom={}; let sum=0,n=0;
  DOMAINS.forEach(d=>{ let s=0,c=0; d.items.forEach((_,i)=>{ const v=f.scores[d.key+(i+1)]; if(v){s+=v;c++;} }); dom[d.key]={sum:s,n:c,avg:c?s/c:0}; sum+=s; n+=c; });
  return {dom,sum,max:n*5,n,pct:n?Math.round(sum*100/(n*5)):0};
}
const fmt=x=>x?x.toFixed(2).replace(/\.?0+$/,''):'–';

/* ---------- loading ---------- */
async function load(first){
  try{
    const r=await call('getInit',PIN);
    if(r&&r.needPin){ showPin(r.wrong); return; }
    INIT=r; state='ok'; ls('init',JSON.stringify(r));
    document.getElementById('bar').hidden=false;
    if(first) render(); else if(view!=='new') render(); else updStatus();
    if(pending.length) flush();
  }catch(e){
    state='off';
    if(first){ try{ const c=JSON.parse(ls('init')||'null'); if(c) INIT=c; }catch(_){}
      document.getElementById('bar').hidden=false; render(); }
    updStatus();
  }
}
function showPin(wrong){
  document.getElementById('bar').hidden=true; document.getElementById('savebar').hidden=true;
  $main.innerHTML=`<div class="card pinbox">
    ${IS_GAS?'':`<label class="f" for="api">رابط تطبيق جوجل (ينتهي بـ /exec)<input id="api" type="url" dir="ltr" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"></label>`}
    <label class="f" for="pin">رمز الدخول<input id="pin" type="tel" inputmode="numeric" autocomplete="off"></label>
    ${wrong?'<div class="err">الرمز غير صحيح</div>':''}<button class="primary" id="pinGo">حفظ ودخول</button></div>`;
  const i=document.getElementById('pin'); i.value=PIN; const a=document.getElementById('api'); if(a) a.value=API;
  (a&&!API?a:i).focus();
  const go=()=>{ if(a){ const u=a.value.trim(); if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){ toast('الصق رابط تطبيق جوجل كاملاً، ينتهي بـ /exec'); a.focus(); return; } API=u; ls('api',API); }
    PIN=i.value.trim(); ls('pin',PIN); $main.innerHTML='<div class="empty">جارٍ التحميل …</div>'; load(true);};
  document.getElementById('pinGo').onclick=go; i.onkeydown=e=>{if(e.key==='Enter')go();};
}

/* ---------- saving ---------- */
let flushing=false, retryT=null, retryDelay=4000;
async function flush(){
  if(flushing||!pending.length) return;
  flushing=true; updStatus();
  const v=pending[0];
  try{
    const r=await call('saveVisit',PIN,v);
    if(r&&r.needPin){ flushing=false; showPin(true); return; }
    pending.shift(); saveLocal(); state='ok'; retryDelay=4000;
    upsertLocal(v, r && r.pdf);
    toast(r && r.pdf ? 'تم حفظ الزيارة وإنشاء التقرير في الدرايف' : 'تم حفظ الزيارة');
  }catch(e){
    state='off'; clearTimeout(retryT); retryT=setTimeout(flush,retryDelay); retryDelay=Math.min(retryDelay*2,60000);
  }finally{
    flushing=false; updStatus();
    if(state==='ok'&&pending.length) flush();
    else if(state==='ok' && view!=='new') render();
  }
}
window.addEventListener('online',()=>{retryDelay=4000;flush();});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') flush(); });

function upsertLocal(v,pdf){
  const c=calc(v);
  const row={id:v.id,date:v.date,teacher:v.teacher,cls:v.cls,subject:v.subject,title:v.title,pct:c.pct,sum:c.sum,max:c.max,
    dom:Object.fromEntries(DOMAINS.map(d=>[d.key,c.dom[d.key].avg])),pdf:pdf||''};
  const i=INIT.visits.findIndex(x=>x.id===v.id);
  if(i>=0){ if(!pdf) row.pdf=INIT.visits[i].pdf; INIT.visits[i]=row; } else INIT.visits.unshift(row);
  if(v.teacher && !INIT.teachers.some(t=>t.name===v.teacher)) INIT.teachers.push({name:v.teacher,subject:v.subject});
}

function statusLine(){
  const n=pending.length;
  if(state==='ok'&&!n) return '<span class="dot ok"></span>متصل — الحفظ في الدرايف';
  if(flushing||(state==='ok'&&n)) return `<span class="dot warn"></span>جارٍ إرسال ${n} …`;
  if(state==='connecting') return '<span class="dot warn"></span>جارٍ الاتصال …';
  return `<span class="dot err"></span>لا يوجد اتصال${n?` — ${n} زيارة محفوظة على الجهاز وستُرسل تلقائياً`:''}`;
}
function updStatus(){ const s=document.getElementById('st'); if(s) s.innerHTML=statusLine(); }

/* ---------- report (print + PDF) ---------- */
function reportHtml(f){
  const c=calc(f);
  const tick=(v,k)=>v===k?'✔':'';
  let rows='';
  DOMAINS.forEach(d=>{
    rows+=`<tr class="dh"><th style="width:28px">م</th><th class="it">${d.title}</th>${[1,2,3,4,5].map(k=>`<th style="width:34px">${k}</th>`).join('')}</tr>`;
    d.items.forEach((t,i)=>{
      const txt=d.free?(f.evalItems[i]||''):t; const v=f.scores[d.key+(i+1)]||0;
      rows+=`<tr><td>${i+1}</td><td class="it">${esc(txt)}</td>${[1,2,3,4,5].map(k=>`<td>${tick(v,k)}</td>`).join('')}</tr>`;
    });
    rows+=`<tr><td colspan="7" class="it nt"><b>ملاحظات:</b> ${esc(f.notes[d.key]||'')}${c.dom[d.key].n?` <span style="float:left">المتوسط: ${fmt(c.dom[d.key].avg)} من 5</span>`:''}</td></tr>`;
  });
  return `<div dir="rtl" style="font-family:Arial,'Simplified Arabic',Tahoma,sans-serif;color:#000;font-size:12.5px;line-height:1.45">
  <style>.rp table{border-collapse:collapse;width:100%;margin-top:6px}.rp td,.rp th{border:1px solid #000;padding:4px 5px;text-align:center}.rp .it{text-align:right}.rp .dh th{background:#e8e8e8}.rp .nt{height:26px}</style>
  <div class="rp">
  <div style="text-align:center;font-weight:bold;line-height:1.5">${HEADER.map(esc).join('<br>')}</div>
  <div style="text-align:center;font-weight:bold;font-size:16px;margin:6px 0">تقرير زيارة صفية</div>
  <table><tr><th>اسم المعلم</th><td>${esc(f.teacher)}</td><th>الصف والشعبة</th><td>${esc(f.cls)}</td><th>عدد الطلاب</th><td>${esc(f.count)}</td><th>الغياب</th><td>${esc(f.absent)}</td></tr>
  <tr><th>المادة</th><td>${esc(f.subject)}</td><th>عنوان الدرس</th><td colspan="3">${esc(f.title)}</td><th>التاريخ</th><td>${esc(String(f.date||'').split('-').reverse().join('-'))}</td></tr></table>
  <table>${rows}</table>
  <table><tr><th>المجموع</th><td>${c.sum} من ${c.max}</td><th>النسبة</th><td>${c.pct}%</td></tr></table>
  <table><tr><th style="width:50%">جوانب إيجابية وإبداعية</th><th>تأملات</th></tr>
  <tr><td class="it" style="height:70px;vertical-align:top;white-space:pre-wrap">${esc(f.positives)}</td><td class="it" style="vertical-align:top;white-space:pre-wrap">${esc(f.reflections)}</td></tr></table>
  <table style="margin-top:14px"><tr><td class="it" style="border:none">مدير المدرسة: ${esc(INIT.principal||'..........................')} &nbsp; التوقيع: ............</td><td class="it" style="border:none">اسم المعلم: ${esc(f.teacher)} &nbsp; التوقيع: ............</td></tr></table>
  </div></div>`;
}
function printVisit(f){ document.getElementById('printArea').innerHTML=reportHtml(f); setTimeout(()=>window.print(),50); }

/* ---------- views ---------- */
function setView(v){ view=v; render(); window.scrollTo({top:0}); }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  document.getElementById('savebar').hidden = view!=='new';
  if(view==='new') renderForm(); else if(view==='list') renderList(); else renderTeachers();
}

function renderForm(){
  const tl=INIT.teachers.map(t=>`<option value="${esc(t.name)}"></option>`).join('');
  $main.innerHTML=`
  <div class="status" id="st">${statusLine()}</div>
  ${form.id && INIT.visits.some(v=>v.id===form.id)?'<div class="card" style="padding:8px 14px;font-size:13.5px">تعديل زيارة محفوظة — الحفظ يستبدل الزيارة السابقة.</div>':''}
  <div class="card"><div class="grid">
    <label class="f wide">اسم المعلم<input id="f_teacher" list="tlist" autocomplete="off"><datalist id="tlist">${tl}</datalist></label>
    <label class="f">الصف<select id="f_grade"><option value="">اختر الصف</option>${GRADES.map(g=>`<option>${g}</option>`).join('')}</select></label>
    <label class="f">الشعبة<select id="f_sec"><option value="">اختر الشعبة</option>${Array.from({length:20},(_,i)=>`<option>${i+1}</option>`).join('')}</select></label>
    <label class="f">المادة<select id="f_subject"><option value="">اختر المادة</option>${SUBJECTS.concat(form.subject&&!SUBJECTS.includes(form.subject)?[form.subject]:[]).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
    <label class="f">التاريخ<input id="f_date" type="date"></label>
    <label class="f">عدد الطلاب<input id="f_count" type="number" inputmode="numeric" min="0"></label>
    <label class="f">الغياب<input id="f_absent" type="number" inputmode="numeric" min="0"></label>
    <label class="f wide">عنوان الدرس<input id="f_title"></label>
  </div></div>
  <div class="legend">التقدير من 1 (ضعيف) إلى 5 (ممتاز) — اضغط الرقم مرة ثانية لإلغائه.</div>
  ${DOMAINS.map(d=>`
  <section class="card" data-d="${d.key}">
    <h2>${d.title}<span class="avg" id="avg_${d.key}"></span></h2>
    <div class="items">${d.items.map((t,i)=>`
      <div class="item"><div class="t"><span class="n">${i+1}</span>${d.free?`<input data-ev="${i}" placeholder="اكتب بند التقويم (اختياري)">`:`<span>${t}</span>`}</div>
      <div class="scale" data-k="${d.key}${i+1}">${[1,2,3,4,5].map(v=>`<button data-v="${v}" aria-pressed="false" aria-label="${v}">${v}</button>`).join('')}</div></div>`).join('')}
    </div>
    <div class="notes"><div class="nbar"><span>ملاحظات ${d.title}:</span><div class="mseg" role="group"><button data-mode="auto" data-k="${d.key}">العبارة الجاهزة</button><button data-mode="own" data-k="${d.key}">أخرى (أكتبها بنفسي)</button></div></div><textarea data-note="${d.key}"></textarea></div>
  </section>`).join('')}
  <div class="card"><div class="grid">
    <label class="f wide">جوانب إيجابية وإبداعية<textarea id="f_positives"></textarea></label>
    <label class="f wide">تأملات<textarea id="f_reflections"></textarea></label>
  </div></div>`;
  // fill values
  if(form.cls && !form.grade){ const m=String(form.cls).match(/^(\S+)\s+(\d+)$/); if(m && GRADES.includes(m[1])){ form.grade=m[1]; form.sec=m[2]; } }
  const gs=document.getElementById('f_grade'), ss=document.getElementById('f_sec');
  gs.value=form.grade||''; ss.value=form.sec||'';
  const updCls=()=>{ form.grade=gs.value; form.sec=ss.value; form.cls=[gs.value,ss.value].filter(Boolean).join(' '); saveLocal(); };
  gs.onchange=updCls; ss.onchange=updCls;
  ['teacher','subject','count','absent','title','date','positives','reflections'].forEach(k=>{
    const el=document.getElementById('f_'+k); el.value=form[k]||'';
    el.oninput=()=>{ form[k]=el.value; saveLocal(); };
  });
  document.getElementById('f_teacher').onchange=e=>{
    const t=INIT.teachers.find(x=>x.name===e.target.value.trim());
    if(t&&t.subject&&!form.subject&&SUBJECTS.includes(t.subject)){ form.subject=t.subject; document.getElementById('f_subject').value=t.subject; saveLocal(); }
  };
  document.querySelectorAll('[data-ev]').forEach(el=>{ const i=+el.dataset.ev; el.value=form.evalItems[i]||''; el.oninput=()=>{form.evalItems[i]=el.value;saveLocal();}; });
  form.noteMode=form.noteMode||{}; form.own=form.own||{};
  DOMAINS.forEach(d=>{ const k=d.key; if(!form.noteMode[k]){ const n=form.notes[k]||''; form.noteMode[k]=(!n||n===genNote(k))?'auto':'own'; if(form.noteMode[k]==='own') form.own[k]=n; } });
  document.querySelectorAll('[data-note]').forEach(el=>{ const k=el.dataset.note;
    el.oninput=()=>{ if(form.noteMode[k]!=='own') return; form.own[k]=el.value; form.notes[k]=el.value; saveLocal(); }; });
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ form.noteMode[b.dataset.k]=b.dataset.mode; showNote(b.dataset.k); saveLocal();
    if(b.dataset.mode==='own'){ const t=document.querySelector(`[data-note="${b.dataset.k}"]`); t.focus(); } });
  DOMAINS.forEach(d=>showNote(d.key));
  document.querySelectorAll('.scale').forEach(sc=>{
    const k=sc.dataset.k;
    sc.querySelectorAll('button').forEach(b=>{
      b.setAttribute('aria-pressed', form.scores[k]===+b.dataset.v);
      b.onclick=()=>{ const v=+b.dataset.v; if(form.scores[k]===v) delete form.scores[k]; else form.scores[k]=v;
        sc.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',form.scores[k]===+x.dataset.v)); showNote(k.replace(/\d+$/,'')); saveLocal(); updScore(); };
    });
  });
  updScore();
}
function updScore(){
  const c=calc(form);
  DOMAINS.forEach(d=>{ const el=document.getElementById('avg_'+d.key); if(el) el.textContent=c.dom[d.key].n?`المتوسط ${fmt(c.dom[d.key].avg)} من 5`:''; });
  document.getElementById('score').innerHTML=c.n?`<b>${c.pct}%</b> · ${c.sum} من ${c.max}`:'<span style="color:var(--muted)">لم يُقيَّم أي بند بعد</span>';
}
document.getElementById('btnSave').onclick=()=>{
  const f=form;
  if(!f.teacher.trim()){ toast('اكتب اسم المعلم'); document.getElementById('f_teacher').focus(); return; }
  if(!Object.keys(f.scores).length){ toast('قيّم بنداً واحداً على الأقل'); return; }
  if(!f.id) f.id=newId();
  f.teacher=f.teacher.trim();
  f.savedAt=new Date().toISOString();
  f.report=reportHtml(f);
  pending=pending.filter(p=>p.id!==f.id); pending.push(JSON.parse(JSON.stringify(f))); keepMine(f);
  upsertLocal(f,'');
  form=blank(); saveLocal();
  toast(state==='ok'?'جارٍ الحفظ …':'حُفظت على الجهاز وستُرسل عند الاتصال');
  flush(); setView('list');
};
document.getElementById('btnClear').onclick=()=>{
  if(document.getElementById('btnClear').dataset.arm!=='1'){ const b=document.getElementById('btnClear'); b.dataset.arm='1'; b.textContent='اضغط للتأكيد'; setTimeout(()=>{b.dataset.arm='';b.textContent='نموذج جديد';},2500); return; }
  form=blank(); saveLocal(); renderForm(); window.scrollTo({top:0});
};

function renderList(){
  const q=(ls('q')||'');
  const vs=INIT.visits.filter(v=>!q||v.teacher.includes(q)||String(v.subject).includes(q));
  $main.innerHTML=`
  <div class="status" id="st">${statusLine()}</div>
  <input id="q" type="search" placeholder="بحث باسم المعلم أو المادة">
  <div class="list" id="vl">${vs.length?vs.map(v=>`
    <div class="card vrow">
      <div class="pct" style="color:${v.pct>=80?'var(--good)':v.pct>=60?'var(--s3)':'var(--bad)'}">${v.max?v.pct+'%':'–'}</div>
      <div class="who"><div class="name">${esc(v.teacher)}</div>
        <div class="sub">${esc(v.date)} · ${esc(v.subject)} · ${esc(v.cls)}${v.title?' · '+esc(v.title):''}${pending.some(p=>p.id===v.id)?' · <b style="color:var(--s2)">بانتظار الإرسال</b>':''}</div></div>
      <div class="acts">
        <button data-act="open" data-id="${v.id}">فتح / تعديل</button>
        <button data-act="print" data-id="${v.id}">طباعة</button>
        <button class="danger" data-del="${v.id}">حذف</button>
        ${v.pdf?`<a href="${esc(v.pdf)}" target="_blank" rel="noopener">PDF في الدرايف</a>`:''}
      </div>
    </div>`).join(''):'<div class="empty">لا توجد زيارات محفوظة بعد. ابدأ من «زيارة جديدة».</div>'}</div>`;
  const qi=document.getElementById('q'); qi.value=q; qi.oninput=()=>{ls('q',qi.value.trim()); const p=qi.selectionStart; renderList(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>openVisit(b.dataset.id,b.dataset.act));
  document.querySelectorAll('[data-del]').forEach(b=>armBtn(b,'اضغط للتأكيد',()=>deleteVisit(b.dataset.del)));
}
async function openVisit(id,act){
  let v=pending.find(p=>p.id===id);
  if(!v && (!navigator.onLine || state!=='ok') && MINE[id]) v=MINE[id];
  if(!v){
    try{ toast('جارٍ فتح الزيارة …'); const r=await call('getVisit',PIN,id); if(r&&r.needPin){showPin(true);return;} v=r; }
    catch(e){ v=MINE[id]; if(!v){ toast('تعذّر الاتصال — لا يمكن فتح هذه الزيارة دون إنترنت'); return; } }
  }
  if(!v){ toast('لم تُعثر على الزيارة'); return; }
  v=JSON.parse(JSON.stringify(v)); delete v.report;
  v.evalItems=v.evalItems||['','','','','']; v.notes=v.notes||{}; v.scores=v.scores||{};
  if(act==='print'){ printVisit(v); return; }
  form=v; saveLocal(); setView('new');
}

function armBtn(b,confirmLabel,fn){
  const orig=b.textContent;
  b.onclick=()=>{
    if(b.dataset.arm==='1'){ b.dataset.arm=''; b.classList.remove('armed'); b.textContent=orig; fn(); return; }
    b.dataset.arm='1'; b.classList.add('armed'); b.textContent=confirmLabel;
    setTimeout(()=>{ if(b.dataset.arm==='1'){ b.dataset.arm=''; b.classList.remove('armed'); b.textContent=orig; } },3000);
  };
}
async function deleteVisit(id){
  const local=pending.some(p=>p.id===id);
  if(state==='ok'){
    try{ const r=await call('deleteVisit',PIN,id); if(r&&r.needPin){showPin(true);return;} }
    catch(e){ if(!local){ toast('تعذّر الحذف — تحقق من الإنترنت'); return; } }
  } else if(!local){ toast('الحذف يحتاج إنترنت — حاول عند الاتصال'); return; }
  pending=pending.filter(p=>p.id!==id); delete MINE[id]; ls('mine',JSON.stringify(MINE));
  INIT.visits=INIT.visits.filter(v=>v.id!==id); ls('init',JSON.stringify(INIT));
  if(form.id===id) form=blank();
  saveLocal(); toast('تم حذف الزيارة'); render();
}
async function archiveTeacher(name){
  if(state!=='ok'){ toast('هذه العملية تحتاج إنترنت'); return; }
  if(pending.some(p=>p.teacher===name)){ toast('انتظر حتى تُرسل زيارات هذه المعلمة ثم أعد المحاولة'); return; }
  try{ const r=await call('archiveTeacher',PIN,name); if(r&&r.needPin){showPin(true);return;}
    INIT.visits=INIT.visits.filter(v=>v.teacher!==name); INIT.teachers=INIT.teachers.filter(t=>t.name!==name); ls('init',JSON.stringify(INIT));
    toast(`نُقلت «${name}» وزياراتها (${r.moved||0}) إلى ورقة الأرشيف`); render();
  }catch(e){ toast('تعذّر التنفيذ — تحقق من الإنترنت'); }
}
function renderTeachers(){
  const by={};
  INIT.visits.forEach(v=>{ (by[v.teacher]=by[v.teacher]||[]).push(v); });
  const names=Object.keys(by).sort((a,b)=>a.localeCompare(b,'ar'));
  const avg=(arr,f)=>{const x=arr.map(f).filter(n=>n>0);return x.length?x.reduce((a,b)=>a+b,0)/x.length:0;};
  const rows=names.map(n=>{
    const vs=by[n].slice().sort((a,b)=>String(b.date).localeCompare(a.date));
    return `<tr><td>${esc(n)}</td><td>${vs.length}</td><td>${esc(vs[0].date)}</td><td><b>${Math.round(avg(vs,v=>v.pct))}%</b></td>${DOMAINS.map(d=>`<td>${fmt(avg(vs,v=>v.dom&&v.dom[d.key]||0))}</td>`).join('')}<td><button class="danger" style="font-size:12px;padding:4px 10px" data-arch="${esc(n)}">نقل / حذف</button></td></tr>`;
  }).join('');
  $main.innerHTML=`
  <div class="status" id="st">${statusLine()}</div>
  ${names.length?`<div class="tablebox"><table><thead><tr><th>المعلم</th><th>الزيارات</th><th>آخر زيارة</th><th>متوسط النسبة</th>${DOMAINS.map(d=>`<th>${d.title}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="legend">«نقل / حذف» يُخرج المعلمة من القائمة والملخص، وتُحفظ زياراتها وتقاريرها في ورقة «الأرشيف» بملف الشيت. متوسطات المجالات من 5. الملخص نفسه موجود في ملف Google Sheets (ورقة «ملخص المعلمين»).</div>`:'<div class="empty">لا توجد زيارات بعد.</div>'}`;
  document.querySelectorAll('[data-arch]').forEach(b=>armBtn(b,'تأكيد النقل',()=>archiveTeacher(b.dataset.arch)));
}

document.getElementById('btnSet').onclick=()=>showPin(false);
if(!IS_GAS && !API) showPin(false); else load(true);
</script>
</body></html>
